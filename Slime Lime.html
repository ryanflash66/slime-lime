<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Slime Lime — Late nights deserve better fuel.</title>
<meta name="description" content="Late nights deserve better fuel. Slime Lime is a clean-formula gaming soda — a conceptual brand designed end-to-end, from naming and identity to packaging and this site."/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Slime Lime — Late nights deserve better fuel."/>
<meta property="og:description" content="Late nights deserve better fuel. A clean-formula gaming soda — a conceptual brand designed end-to-end."/>
<meta property="og:url" content="https://slime-lime-eta.vercel.app/"/>
<meta property="og:image" content="https://slime-lime-eta.vercel.app/assets/logo-primary-1024.png"/>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png"/>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
<meta name="theme-color" content="#8BBE1C"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"/>
<link rel="stylesheet" href="colors_and_type.css"/>
<link rel="stylesheet" href="site.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="assets/Bottle.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="flagship.jsx"></script>
<script type="text/babel" src="subscribe.jsx"></script>
<script type="text/babel" src="story-faq.jsx"></script>

<script type="text/babel">
const { useState: useStateApp, useEffect: useEffectApp } = React;

function App() {
  const route = window.useRoute();
  const cart = window.useCart();
  const [flavor, setFlavor] = useStateApp(window.FLAVORS[0]);
  // The flagship PDP is always Lemon-Lime, whatever flavor is picked on Home.
  window.useFlavorTheme(route.startsWith('/flagship') ? window.FLAVORS[0] : flavor);

  let page;
  if (route.startsWith('/flagship')) page = <window.FlagshipPage flavor={flavor} onAdd={cart.add}/>;
  else if (route.startsWith('/subscribe')) page = <window.SubscribePage onAdd={cart.add} onSubscribe={cart.replaceSubscription}/>;
  else if (route.startsWith('/story')) page = <window.StoryPage/>;
  else if (route.startsWith('/faq')) page = <window.FAQPage/>;
  else page = <window.HomePage flavor={flavor} onPickFlavor={setFlavor} onAdd={cart.add}/>;

  return (
    <div>
      <window.Nav cartCount={cart.count} onCart={() => cart.setCartOpen(true)} route={route}/>
      {page}
      <window.Footer/>
      <window.CartDrawer
        open={cart.cartOpen}
        items={cart.cart}
        onClose={() => cart.setCartOpen(false)}
        onInc={cart.inc}
        onDec={cart.dec}
        total={cart.total}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
