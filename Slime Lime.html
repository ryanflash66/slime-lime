<script type="text/babel">
const { useState: useStateApp, useEffect: useEffectApp, useRef: useRefApp } = React;

function App() {
  const url = window.useRoute();
  const pageRef = useRefApp(null);
  // The page on screen lags the URL while the GSAP curtain covers the swap.
  const route = window.useRouteStage(url, pageRef);
  const cart = window.useCart();
  const [flavor, setFlavor] = useStateApp(window.FLAVORS[0]);
  // The flagship PDP is always Lemon-Lime, whatever flavor is picked on Home.
  window.useFlavorTheme(route.startsWith('/flagship') ? window.FLAVORS[0] : flavor);

  let page;
  if (route.startsWith('/flagship')) page = <window.FlagshipPage flavor={flavor} onAdd={cart.add}/>;
  else if (route.startsWith('/subscribe')) page = <window.SubscribePage onAdd={cart.add} onSubscribe={cart.replaceSubscription}/>;
  else if (route.startsWith('/story')) page = <window.StoryPage/>;
  else if (route.startsWith('/faq')) page = <window.FAQPage/>;
  else page = <window.HomePage flavor={flavor} onPickFlavor={setFlavor} onAdd={cart.add}/>;

  return (
    <div>
      <window.Nav cartCount={cart.count} onCart={() => cart.setCartOpen(true)} route={url}/>
      <div ref={pageRef}>{page}</div>
      <window.Footer/>
      <window.FridgeDrawer
        open={cart.cartOpen}
        items={cart.cart}
        onClose={() => cart.setCartOpen(false)}
        onSetQty={cart.setQty}
        onInc={cart.inc}
        onDec={cart.dec}
        total={cart.total}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
