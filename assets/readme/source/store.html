<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=block">
<link rel="stylesheet" href="readme.css">
<style>
  .card { padding: 40px 44px 40px; background: radial-gradient(110% 90% at 0% 0%, #10220F 0%, var(--canvas) 55%); }
  .grid { display: grid; grid-template-columns: 1fr 320px; gap: 22px; align-items: start; }
  h2 { font-size: 40px; margin: 14px 0 28px; }
  h2 em { font-style: normal; color: var(--lime); }
  .lbl { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .n { font-family: 'JetBrains Mono'; font-weight: 700; color: var(--lime); font-size: 13px; }
  .t { font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
  .shot { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  .shot img { width: 100%; display: block; }
  .fridge img { width: 100%; }
  .notes { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .note { border: 1px solid var(--line-soft); background: var(--card); border-radius: 14px; padding: 14px 16px; }
  .note .mono { font-size: 10.5px; color: var(--lime); margin-bottom: 6px; }
  .note p { font-size: 14px; line-height: 1.45; color: #D6D9CC; }
</style></head>
<body>
<div class="card" id="card">
  <div class="grid">
    <div>
      <div class="eyebrow mono">Two ways to shop</div>
      <h2 class="disp">Talk to it, <em>or just browse.</em></h2>
      <div class="lbl"><span class="n">01</span><span class="t">Pick a mode on your first visit</span></div>
      <div class="shot"><img src="shots/picker.webp" alt=""></div>
      <div class="notes">
        <div class="note"><div class="mono">Hands-free</div><p>The concierge listens and answers out loud. Say "stop listening" to end.</p></div>
        <div class="note"><div class="mono">Legacy</div><p>The full store: browse flavors, stock the Fridge, subscribe, check out.</p></div>
      </div>
    </div>
    <div>
      <div class="lbl" style="margin-top:0"><span class="n">02</span><span class="t">The Fridge</span></div>
      <div class="shot fridge"><img src="shots/fridge.webp" alt=""></div>
    </div>
  </div>
  <div class="corner tl"></div><div class="corner br"></div>
</div>
</body></html>
